<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Bushrann Content Uploader</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f4f6f8;
    color: #1c2430;
  }
  main { max-width: 560px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #66707d; font-size: 14px; margin-bottom: 24px; }
  .card {
    background: #fff; border: 1px solid #dde3ea; border-radius: 12px;
    padding: 24px; margin-bottom: 16px;
  }
  label { display: block; font-size: 14px; font-weight: 600; margin: 14px 0 6px; }
  input[type="email"], input[type="password"], input[type="text"], textarea, select {
    width: 100%; padding: 10px 12px; border: 1px solid #c6ced8; border-radius: 8px;
    font-size: 15px; font-family: inherit;
  }
  textarea { resize: vertical; min-height: 56px; }
  .hint { font-size: 12px; color: #7b8593; margin-top: 4px; }
  button {
    width: 100%; padding: 12px; border: 0; border-radius: 8px; font-size: 16px;
    font-weight: 600; cursor: pointer; background: #0d6e4f; color: #fff; margin-top: 18px;
  }
  button:disabled { background: #9db3aa; cursor: not-allowed; }
  button.secondary { background: #e6ebf0; color: #1c2430; }
  #status {
    margin-top: 16px; padding: 12px; border-radius: 8px; font-size: 14px;
    display: none; white-space: pre-wrap;
  }
  #status.show { display: block; }
  #status.info { background: #e8f1fd; color: #1d4ed8; }
  #status.ok { background: #e6f6ef; color: #0d6e4f; }
  #status.err { background: #fdeaea; color: #b42318; }
  progress { width: 100%; height: 8px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; }
  .charCount { font-size: 12px; color: #7b8593; }
  .errorText { color: #b42318; font-size: 14px; margin-top: 8px; display: none; }
  .errorText.show { display: block; }

  /* Per-video item cards */
  .vid { border: 1px solid #dde3ea; border-radius: 8px; padding: 14px; margin-top: 14px; }
  .vid .vhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .vid .vname { font-size: 14px; font-weight: 600; word-break: break-all; }
  .vid .vsize { font-size: 12px; color: #7b8593; white-space: nowrap; }
  .vid .vremove {
    width: auto; margin: 0; padding: 2px 10px; font-size: 12px; font-weight: 600;
    background: #e6ebf0; color: #1c2430;
  }
  .vid progress { margin-top: 10px; }
  .vid label { margin-top: 10px; font-size: 13px; }
  .vstatus {
    margin-top: 10px; padding: 10px; border-radius: 6px; font-size: 13px;
    display: none; white-space: pre-wrap;
  }
  .vstatus.show { display: block; }
  .vstatus.info { background: #e8f1fd; color: #1d4ed8; }
  .vstatus.ok { background: #e6f6ef; color: #0d6e4f; }
  .vstatus.err { background: #fdeaea; color: #b42318; }
</style>
</head>
<body>
<main>
  <h1>Bushrann Content Uploader</h1>
  <div class="sub">Admin-only curated video upload. Videos go through the normal moderation and processing pipeline.</div>

  <!-- Sign in -->
  <section id="loginCard" class="card">
    <label for="email">Bushrann account email</label>
    <input id="email" type="email" autocomplete="username" />
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" />
    <button id="signInBtn">Sign in</button>
    <button id="googleBtn" class="secondary" type="button">Continue with Google</button>
    <div id="loginError" class="errorText"></div>
  </section>

  <!-- Uploader (hidden until admin verified) -->
  <section id="uploaderCard" class="card" style="display:none">
    <div class="row">
      <strong id="whoami"></strong>
      <button id="signOutBtn" class="secondary" style="width:auto; margin:0; padding:6px 12px; font-size:13px">Sign out</button>
    </div>

    <label for="videoFiles">Videos</label>
    <input id="videoFiles" type="file" accept="video/*" multiple />
    <div class="hint">Select up to 10 videos. Maximum 500MB per video. MP4 (H.264) recommended.</div>
    <div id="batchCount" class="hint"></div>
    <div id="itemList"></div>

    <button id="batchBtn">Upload Batch to Bushrann</button>
    <div id="status" class="info"></div>
  </section>
</main>

<script src="/admin-uploader-assets/supabase-js.js"></script>
<script src="/admin-uploader-assets/tus.min.js"></script>
<script>
(function () {
  'use strict';

  var CATEGORIES = ['Quran', 'Hadith', 'Reminder', 'Lecture', 'Nasheeds', 'Dua', 'Other'];
  var MAX_BYTES = 500 * 1024 * 1024;
  var MAX_CAPTION = 200;
  var MAX_FILES = 10;
  var POLL_INTERVAL_MS = 10000;
  var POLL_MAX_ATTEMPTS = 30; // ~5 minutes, then report background processing

  var supabase = null;      // supabase-js client (created after config load)
  var configError = null;

  // ---- DOM ----
  function $(id) { return document.getElementById(id); }
  var loginCard = $('loginCard'), uploaderCard = $('uploaderCard');
  var statusEl = $('status'), batchBtn = $('batchBtn');
  var itemListEl = $('itemList'), batchCountEl = $('batchCount');

  function setStatus(kind, text) {
    statusEl.className = 'show ' + kind;
    statusEl.textContent = text;
  }
  function clearStatus() { statusEl.className = ''; statusEl.textContent = ''; }

  // ---- Per-item helpers ----
  var itemSeq = 0;
  var items = [];           // selected videos with per-item DOM + metadata
  var batchRunning = false;

  function setItemStatus(item, kind, text) {
    item.statusEl.className = 'vstatus show ' + kind;
    item.statusEl.textContent = text;
  }
  function setItemProgress(item, pct) {
    item.progressEl.style.display = '';
    item.progressEl.value = pct;
  }
  function hideItemProgress(item) { item.progressEl.style.display = 'none'; }

  function updateBatchCount(submitted, total) {
    batchCountEl.textContent = total > 0
      ? 'Completed ' + submitted + ' / ' + total
      : '';
  }

  function removeItem(id) {
    if (batchRunning) return;
    items = items.filter(function (it) { return it.id !== id; });
    var el = $('vid-' + id);
    if (el) el.parentNode.removeChild(el);
    updateBatchCount(0, items.length);
  }

  function buildItems(files) {
    if (batchRunning) return;
    items = [];
    itemListEl.innerHTML = '';

    var list = Array.prototype.slice.call(files);
    if (list.length > MAX_FILES) {
      setStatus('err', 'You selected ' + list.length + ' videos. Only the first ' + MAX_FILES + ' were kept; remove files to upload the rest in another batch.');
      list = list.slice(0, MAX_FILES);
    } else {
      clearStatus();
    }

    list.forEach(function (file) {
      var id = ++itemSeq;
      var wrap = document.createElement('div');
      wrap.className = 'vid';
      wrap.id = 'vid-' + id;
      wrap.innerHTML =
        '<div class="vhead">' +
          '<span class="vname"></span>' +
          '<span class="vsize"></span>' +
          '<button class="vremove" type="button">Remove</button>' +
        '</div>' +
        '<progress max="100" value="0" style="display:none"></progress>' +
        '<label>Caption <span class="charCount">0/' + MAX_CAPTION + '</span></label>' +
        '<textarea maxlength="' + MAX_CAPTION + '"></textarea>' +
        '<label>Category</label>' +
        '<select>' + CATEGORIES.map(function (c) { return '<option>' + c + '</option>'; }).join('') + '</select>' +
        '<label>Source / Credit <span style="font-weight:400">(optional)</span></label>' +
        '<input type="text" placeholder="e.g. Sheikh Assim Al-Hakeem" />' +
        '<div class="vstatus"></div>';
      itemListEl.appendChild(wrap);

      var item = {
        id: id,
        file: file,
        invalid: false,
        captionEl: wrap.querySelector('textarea'),
        categoryEl: wrap.querySelector('select'),
        creditEl: wrap.querySelector('input[type="text"]'),
        progressEl: wrap.querySelector('progress'),
        statusEl: wrap.querySelector('.vstatus')
      };
      wrap.querySelector('.vname').textContent = file.name;
      wrap.querySelector('.vsize').textContent = Math.round(file.size / 1048576) + ' MB';
      wrap.querySelector('.vremove').addEventListener('click', function () { removeItem(id); });
      item.captionEl.addEventListener('input', function () {
        wrap.querySelector('.charCount').textContent = this.value.length + '/' + MAX_CAPTION;
      });

      if (file.size > MAX_BYTES) {
        item.invalid = true;
        setItemStatus(item, 'err', 'Skipped: exceeds the 500MB per-video limit.');
      } else {
        setItemStatus(item, 'info', 'Waiting');
      }

      items.push(item);
    });

    updateBatchCount(0, items.length);
  }

  function setFormDisabled(disabled) {
    batchBtn.disabled = disabled;
    $('videoFiles').disabled = disabled;
    Array.prototype.forEach.call(itemListEl.querySelectorAll('textarea, select, input, button'), function (el) {
      el.disabled = disabled;
    });
  }

  // ---- Config ----
  fetch('/api/admin-uploader/config')
    .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
    .then(function (res) {
      if (!res.ok) {
        configError = res.body.error || 'Failed to load server configuration';
        setStatus('err', configError);
        return;
      }
      supabase = window.supabase.createClient(res.body.supabaseUrl, res.body.supabaseAnonKey, {
        auth: { persistSession: true, autoRefreshToken: true }
      });
      // Resume a persisted session if present.
      supabase.auth.getSession().then(function (_ref) {
        if (_ref.data && _ref.data.session) verifyAdmin();
      });
      // OAuth redirect: supabase-js exchanges the ?code= in the URL
      // asynchronously and emits SIGNED_IN; run the same admin verification.
      supabase.auth.onAuthStateChange(function (event) {
        if (event === 'SIGNED_IN') verifyAdmin();
      });
    })
    .catch(function () {
      configError = 'Failed to load server configuration';
      setStatus('err', configError);
    });

  // ---- Auth ----
  $('signInBtn').addEventListener('click', function () {
    var errEl = $('loginError');
    errEl.className = 'errorText';
    if (configError) { errEl.textContent = configError; errEl.className = 'errorText show'; return; }
    var email = $('email').value.trim(), password = $('password').value;
    if (!email || !password) { errEl.textContent = 'Enter your email and password.'; errEl.className = 'errorText show'; return; }
    supabase.auth.signInWithPassword({ email: email, password: password }).then(function (res) {
      if (res.error) { errEl.textContent = res.error.message; errEl.className = 'errorText show'; return; }
      verifyAdmin();
    });
  });

  $('signOutBtn').addEventListener('click', function () {
    supabase.auth.signOut().then(function () {
      uploaderCard.style.display = 'none';
      loginCard.style.display = '';
    });
  });

  // Google OAuth: redirects to Google, then back to /admin-uploader,
  // where supabase-js restores the session (detectSessionInUrl default).
  $('googleBtn').addEventListener('click', function () {
    var errEl = $('loginError');
    errEl.className = 'errorText';
    if (configError) { errEl.textContent = configError; errEl.className = 'errorText show'; return; }
    supabase.auth.signInWithOAuth({
      provider: 'google',
      options: {
        redirectTo: window.location.origin + '/admin-uploader'
      }
    }).then(function (res) {
      if (res.error) { errEl.textContent = res.error.message; errEl.className = 'errorText show'; }
    });
  });

  // Verifies the current session belongs to a row in the `admins` table.
  function verifyAdmin() {
    supabase.auth.getSession().then(function (_ref) {
      var session = _ref.data && _ref.data.session;
      if (!session) return;
      return fetch('/api/admin-uploader/me', {
        headers: { 'Authorization': 'Bearer ' + session.access_token }
      }).then(function (r) {
        if (r.ok) {
          loginCard.style.display = 'none';
          uploaderCard.style.display = '';
          $('whoami').textContent = session.user.email || '';
        } else if (r.status === 403) {
          var errEl = $('loginError');
          errEl.textContent = 'This account is not an admin.';
          errEl.className = 'errorText show';
          supabase.auth.signOut();
        } else {
          setStatus('err', 'Admin verification failed. Try again.');
        }
      });
    });
  }

  // ---- Helpers mirroring screens/UploadScreen.js ----
  function sanitize(text) { return text.replace(/<[^>]*>/g, '').trim(); }

  function getFreshToken() {
    return supabase.auth.getSession().then(function (_ref) {
      var session = _ref.data && _ref.data.session;
      if (!session) throw new Error('Not signed in');
      var expMs = session.expires_at ? session.expires_at * 1000 : 0;
      if (expMs - Date.now() < 60000) {
        return supabase.auth.refreshSession().then(function (r2) {
          if (r2.error || !r2.data.session) throw new Error('Session expired. Sign in again.');
          return r2.data.session.access_token;
        });
      }
      return session.access_token;
    });
  }

  function removeQuietly(bucket, paths) {
    // Best-effort async cleanup; a rejected remove() must not surface or
    // override the original upload error.
    if (!paths || !paths.length) return;
    supabase.storage.from(bucket).remove(paths).catch(function () { /* best effort, mirrors UploadScreen cleanup */ });
  }

  // ---- Thumbnail: browser video + canvas at ~1s ----
  function generateThumbnail(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var video = document.createElement('video');
      video.muted = true;
      video.playsInline = true;
      video.preload = 'auto';

      function fail(msg) { URL.revokeObjectURL(url); reject(new Error(msg)); }

      video.addEventListener('error', function () { fail('Could not read the video file for thumbnail generation.'); });
      video.addEventListener('loadedmetadata', function () {
        if (!isFinite(video.duration) || video.duration <= 0) { fail('Could not determine video duration.'); return; }
        video.currentTime = Math.min(1, video.duration / 2);
      });
      video.addEventListener('seeked', function () {
        try {
          var canvas = document.createElement('canvas');
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          if (!canvas.width || !canvas.height) { fail('Video has no drawable frames.'); return; }
          canvas.getContext('2d').drawImage(video, 0, 0);
          canvas.toBlob(function (blob) {
            URL.revokeObjectURL(url);
            if (!blob) { reject(new Error('Thumbnail generation failed.')); return; }
            resolve(blob);
          }, 'image/jpeg', 0.8);
        } catch (e) {
          fail('Thumbnail generation failed: ' + e.message);
        }
      });

      video.src = url;
    });
  }

  // ---- File selection ----
  $('videoFiles').addEventListener('change', function () {
    buildItems(this.files);
  });

  // ---- Batch upload: sequential queue, one video at a time ----
  batchBtn.addEventListener('click', function () {
    clearStatus();
    if (batchRunning) return;

    if (items.length === 0) { setStatus('err', 'Choose at least one video file.'); return; }

    // Validate metadata for every item BEFORE starting any upload.
    var queue = [];
    items.forEach(function (item) {
      if (item.invalid) return; // already marked (e.g. oversized)
      var caption = sanitize(item.captionEl.value);
      var category = item.categoryEl.value;
      var credit = sanitize(item.creditEl.value);

      if (!caption) { setItemStatus(item, 'err', 'Skipped: caption is required.'); return; }
      if (CATEGORIES.indexOf(category) < 0) { setItemStatus(item, 'err', 'Skipped: choose a category.'); return; }

      // Source/Credit has no DB column in V1; append it to the caption.
      var finalCaption = credit ? caption + '\n\nSource: ' + credit : caption;
      if (finalCaption.length > MAX_CAPTION) {
        setItemStatus(item, 'err', 'Skipped: caption plus credit exceeds ' + MAX_CAPTION + ' characters.');
        return;
      }

      queue.push({ item: item, finalCaption: finalCaption, category: category });
    });

    if (queue.length === 0) { setStatus('err', 'No valid videos to upload. Fix the errors above.'); return; }

    batchRunning = true;
    setFormDisabled(true);
    batchBtn.textContent = 'Uploading batch...';

    var completed = 0, succeeded = 0, failed = 0;
    updateBatchCount(0, queue.length);

    // Sequentially process one video at a time; an individual failure does
    // not cancel the rest. Processing polling runs detached per item.
    var chain = Promise.resolve();
    queue.forEach(function (entry) {
      chain = chain.then(function () {
        return runUpload(entry.item, entry.item.file, entry.finalCaption, entry.category)
          .then(function () {
            succeeded += 1;
            completed += 1;
            updateBatchCount(completed, queue.length);
          })
          .catch(function (err) {
            // Per-item failure: mark and continue with the next video.
            failed += 1;
            completed += 1;
            updateBatchCount(completed, queue.length);
            setItemStatus(entry.item, 'err', 'Failed: ' + (err && err.message ? err.message : String(err)));
          });
      });
    });

    chain.then(function () {
      batchRunning = false;
      batchBtn.textContent = 'Upload Batch to Bushrann';
      setFormDisabled(false);
      var summary = 'Batch finished: ' + succeeded + ' submitted, ' + failed + ' failed.';
      if (succeeded > 0 && failed > 0) {
        setStatus('info', summary + ' Processing continues in the background per submitted video.');
      } else if (failed > 0) {
        setStatus('err', summary);
      } else {
        setStatus('ok', summary + ' Processing continues in the background per video.');
      }
    });
  });

  // Proven single-video pipeline, parameterized per item.
  // Resolves after the DB insert is committed and processing has been
  // triggered; polling runs detached so the next video starts immediately.
  function runUpload(item, file, finalCaption, category) {
    var videoPath = null, thumbPath = null, videoCommitted = false;

    return getFreshToken()
      .then(function () { return supabase.auth.getUser(); })
      .then(function (_ref) {
        var user = _ref.data && _ref.data.user;
        if (!user) throw new Error('Not signed in');
        return user.id;
      })
      .then(function (uid) {
        var ext = (file.name.split('.').pop() || 'mp4').toLowerCase();
        if (!/^[a-z0-9]{1,5}$/.test(ext)) ext = 'mp4';
        videoPath = uid + '/' + Date.now() + '.' + ext;
        thumbPath = uid + '/' + Date.now() + '.jpg';

        // 1) Thumbnail
        setItemStatus(item, 'info', 'Generating thumbnail...');
        return generateThumbnail(file).then(function (thumbBlob) {
          // 2) Video via TUS (mirrors UploadScreen: bucketName/objectName metadata, fresh token per request)
          setItemStatus(item, 'info', 'Uploading video...');
          return uploadVideoTus(item, file, videoPath).then(function () {
            // 3) Thumbnail upload
            setItemStatus(item, 'info', 'Uploading thumbnail...');
            return supabase.storage.from('thumbnails').upload(thumbPath, thumbBlob, {
              contentType: 'image/jpeg',
              upsert: false
            }).then(function (r) {
              if (r.error) throw r.error;
            });
          });
        }).then(function () {
          // 4) DB insert (mirror of UploadScreen payload; moderation status untouched)
          setItemStatus(item, 'info', 'Creating record...');
          var base = supabase.supabaseUrl + '/storage/v1/object/public';
          var videoUrl = base + '/videos/' + videoPath;
          var thumbnailUrl = base + '/thumbnails/' + thumbPath;
          return supabase.from('videos').insert({
            user_id: uid,
            caption: finalCaption,
            category: category,
            video_url: videoUrl,
            original_video_url: videoUrl,
            processing_status: 'processing',
            thumbnail_url: thumbnailUrl,
            is_private: false,
            views_count: 0,
            likes_count: 0
          }).select('id, status').single().then(function (r) {
            // Commit is confirmed ONLY by a returned row with a valid id.
            // PGRST116 (no row readable) is treated as failure: unlike the
            // mobile app, the owner can always SELECT their own row via the
            // existing "approved OR own" policy, so no row means no commit.
            if (r.error) throw r.error;
            if (!r.data || !r.data.id) throw new Error('Insert did not return a video id');
            videoCommitted = true;
            return r.data.id;
          });
        });
      })
      .then(function (videoId) {
        // From here on the row is committed: storage objects must NOT be deleted on errors.
        return triggerProcessing(item, videoId).then(function () {
          // Detached polling: updates this item's status in the background
          // and never blocks the next video in the batch.
          setItemStatus(item, 'info', 'Processing (submitted) — checking status in the background...');
          pollProcessing(item, videoId);
          hideItemProgress(item);
        });
      })
      .catch(function (err) {
        // Best-effort cleanup of THIS upload's objects only when the DB insert
        // did not commit, mirroring UploadScreen semantics.
        hideItemProgress(item);
        if (!videoCommitted) {
          if (videoPath) removeQuietly('videos', [videoPath]);
          if (thumbPath) removeQuietly('thumbnails', [thumbPath]);
        }
        throw err;
      });
  }

  function uploadVideoTus(item, file, videoPath) {
    return getFreshToken().then(function () {
      return new Promise(function (resolve, reject) {
        var upload = new window.tus.Upload(file, {
          endpoint: supabase.supabaseUrl + '/storage/v1/upload/resumable',
          retryDelays: [0, 3000, 5000, 10000, 20000],
          chunkSize: 6 * 1024 * 1024,
          uploadDataDuringCreation: true,
          metadata: {
            bucketName: 'videos',
            objectName: videoPath,
            contentType: file.type || 'video/mp4',
            cacheControl: '3600'
          },
          // Do NOT set Authorization here. XMLHttpRequest combines repeated
          // setRequestHeader calls into "Bearer <jwt>, Bearer <jwt>", which
          // Supabase rejects with "Invalid Compact JWS". Authorization is set
          // exactly once per request in onBeforeRequest, mirroring UploadScreen.
          headers: { 'x-upsert': 'false' },
          onBeforeRequest: function (req) {
            // Refresh the access token for every request (including creation).
            return getFreshToken().then(function (fresh) {
              req.setHeader('Authorization', 'Bearer ' + fresh);
            });
          },
          onProgress: function (bytesUploaded, bytesTotal) {
            if (bytesTotal > 0) {
              setItemProgress(item, Math.round((bytesUploaded / bytesTotal) * 100));
            }
          },
          onSuccess: function () { resolve(); },
          onError: function (err) { reject(err); }
        });
        upload.start();
      });
    });
  }

  function triggerProcessing(item, videoId) {
    setItemStatus(item, 'info', 'Processing...');
    if (!videoId) {
      // Insert committed but id was not readable (PGRST116) or trigger info missing.
      setItemStatus(item, 'ok', 'Video saved. Processing will start automatically via the recovery sweeper.');
      return Promise.resolve(false);
    }
    return getFreshToken().then(function (token) {
      return fetch('/api/video-processing/process', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ videoId: videoId })
      }).then(function (r) {
        if (!r.ok) {
          // Committed upload is never turned into a failure here; the sweeper recovers.
          setItemStatus(item, 'info', 'Video saved. Immediate processing trigger failed; the recovery sweeper will process it shortly.');
          return false;
        }
        return true;
      }).catch(function () {
        setItemStatus(item, 'info', 'Video saved. Immediate processing trigger failed; the recovery sweeper will process it shortly.');
        return false;
      });
    });
  }

  // Always eventually resolves; never rejects, so detached polling for one
  // video can never hang or fail the batch.
  function pollProcessing(item, videoId) {
    var attempts = 0;
    return new Promise(function (resolve) {
      function tick() {
        attempts += 1;
        supabase.from('videos').select('processing_status')
          .eq('id', videoId).maybeSingle()
          .then(function (r) {
            var st = r.data && r.data.processing_status;
            if (st === 'ready') {
              setItemStatus(item, 'ok', 'Ready — processed; it will appear in Bushrann per the normal moderation rules.');
              return resolve();
            }
            if (st === 'failed') {
              setItemStatus(item, 'err', 'Processing failed on the server. The original upload is preserved; check the Railway logs for this video.');
              return resolve();
            }
            if (attempts >= POLL_MAX_ATTEMPTS) {
              setItemStatus(item, 'info', 'Still processing in the background. Check the app later; the recovery sweeper also monitors this video.');
              return resolve();
            }
            setItemStatus(item, 'info', 'Processing... (' + attempts + '/' + POLL_MAX_ATTEMPTS + ' checks)');
            setTimeout(tick, POLL_INTERVAL_MS);
          })
          .catch(function () {
            // Polling/network errors count as an attempt and never turn a
            // committed upload into a failure; the outer promise always resolves.
            if (attempts >= POLL_MAX_ATTEMPTS) {
              setItemStatus(item, 'info', 'Unable to verify processing status. The video is saved and processing continues in the background; the recovery sweeper also monitors it.');
              return resolve();
            }
            setItemStatus(item, 'info', 'Processing... (status check failed, retrying ' + attempts + '/' + POLL_MAX_ATTEMPTS + ')');
            setTimeout(tick, POLL_INTERVAL_MS);
          });
      }
      setTimeout(tick, POLL_INTERVAL_MS);
    });
  }
})();
</script>
