// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
        classpath 'com.google.gms:google-services:4.4.1'
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
    maven { url "$rootDir/../node_modules/expo/node_modules/expo-modules-core/android/local-maven-repo" }
    maven { url "$rootDir/../node_modules/expo-splash-screen/android/local-maven-repo" }
    maven { url "$rootDir/../node_modules/expo-application/local-maven-repo" }
    maven { url "$rootDir/../node_modules/expo-asset/local-maven-repo" }
    maven { url "$rootDir/../node_modules/expo-camera/local-maven-repo" }
    maven { url "$rootDir/../node_modules/expo-crypto/local-maven-repo" }
    maven { url "$rootDir/../node_modules/expo-file-system/local-maven-repo" }
    maven { url "$rootDir/../node_modules/expo-font/local-maven-repo" }
    maven { url "$rootDir/../node_modules/expo-image-loader/local-maven-repo" }
    maven { url "$rootDir/../node_modules/expo-image-manipulator/local-maven-repo" }
    maven { url "$rootDir/../node_modules/expo-image-picker/local-maven-repo" }
    maven { url "$rootDir/../node_modules/expo-linking/local-maven-repo" }
    maven { url "$rootDir/../node_modules/expo-local-authentication/local-maven-repo" }
    maven { url "$rootDir/../node_modules/expo-media-library/local-maven-repo" }
    maven { url "$rootDir/../node_modules/expo-notifications/local-maven-repo" }
    maven { url "$rootDir/../node_modules/expo-secure-store/local-maven-repo" }
    maven { url "$rootDir/../node_modules/expo-video/local-maven-repo" }
    maven { url "$rootDir/../node_modules/expo-video-thumbnails/local-maven-repo" }
    maven { url "$rootDir/../node_modules/expo-web-browser/local-maven-repo" }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
